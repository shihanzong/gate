name: VPN Gate Node Check

on:
  schedule:
    # 每 2 小时自动运行一次(整点)。想改频率参考:
    #   每小时 0 * * * *  ｜ 每 4 小时 0 */4 * * *  ｜ 每 12 小时 0 */12 * * *  ｜ 每天 0 0 * * *
    # 注意: - cron: 前面必须正好 4 个空格, 缩进错了 GitHub 会静默忽略(不报错、也不运行)
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 【必改】检测 Worker 地址, 读取 GitHub Secret「DOMAIN」
          # 配置入口: 仓库 Settings → Secrets and variables → Actions → New repository secret
          #   Name   = DOMAIN        (必须全大写)
          #   Secret = https://check-sstp.你的用户名.workers.dev/check?sstp=vpn:vpn@
          #            (结尾的 @ 必须保留, 前后不能有空格/换行)
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://你的GitHub用户名.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
